---
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build binary
        run: make build
      - name: check dev server
        run: go vet -tags dev ./cmd/...
      - name: run all tests
        run: make tests
