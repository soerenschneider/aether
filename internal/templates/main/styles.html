{{ define "styles" }}
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-2: #f1f3f5;
            --border: #e4e7eb;
            --text: #111827;
            --muted: #6b7280;
            --faint: #a1a7b1;
            --accent: #2563eb;

            --bad: #dc2626;
            --warn: #d97706;
            --yellow: #b7950b;
            --ok: #16a34a;
            --cold: #0891b2;
            --warm: #f59e0b;

            --radius: 14px;
            --gap: clamp(.75rem, 1.2vw, 1.25rem);
            --pad: clamp(.9rem, 1.1vw, 1.25rem);
            --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0d10;
                --surface: #14171c;
                --surface-2: #1c2027;
                --border: #262b33;
                --text: #e8eaed;
                --muted: #9aa1ab;
                --faint: #636a75;
                --accent: #60a5fa;

                --bad: #f87171;
                --warn: #fbbf24;
                --yellow: #facc15;
                --ok: #4ade80;
                --cold: #22d3ee;
                --warm: #fbbf24;
            }
        }

        *, *::before, *::after { box-sizing: border-box; }

        /* grows from phone to wall display */
        html { font-size: clamp(15px, .45vw + 9.5px, 21px); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 1rem/1.45 var(--font);
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .page { max-width: 1680px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.5rem) 3rem; }

        /* header */
        .top {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: clamp(1.1rem, 2vw, 2rem) 0 clamp(.9rem, 1.5vw, 1.5rem);
        }
        .top h1 { margin: 0; font-size: 1.5rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
        .top h1 span { color: var(--muted); font-weight: 450; }
        .status { margin-left: auto; display: flex; align-items: center; gap: .6rem; color: var(--muted); font-size: .85rem; white-space: nowrap; }
        .live { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
        body.stale .live { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }
        body.stale .updated { color: var(--bad); }
        /* the offline wording lives in CSS so it never shows up in emails or the text rendering */
        body.stale .updated-label { display: none; }
        body.stale .updated::before { content: "Offline · data from "; }
        .refresh {
            display: inline-grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
        }
        .refresh:hover { color: var(--text); }
        .refresh svg { width: 1rem; height: 1rem; }
        .refresh.htmx-request svg, .htmx-request .refresh svg { animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .notice {
            display: flex;
            gap: .5rem;
            align-items: baseline;
            border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--border));
            background: color-mix(in srgb, var(--bad) 8%, var(--surface));
            border-radius: var(--radius);
            padding: .65rem var(--pad);
            margin-bottom: var(--gap);
            font-size: .9rem;
        }
        .notice::before { content: ""; flex: none; width: .5rem; height: .5rem; border-radius: 50%; background: var(--bad); transform: translateY(-.05rem); }
        .notice.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
        .notice.warn::before { background: var(--warn); }

        /* datasources that could not be updated show their last data */
        .outdated-note { margin: 0; padding: .4rem var(--pad); font-size: .8rem; color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-bottom: 1px solid var(--border); }
        .tile.outdated .tile-value, .tile.outdated .tile-sub { opacity: .6; }
        .tile-outdated { margin-top: .35rem; font-size: .75rem; color: var(--warn); }

        /* now: one tile per datasource */
        .now {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr));
            gap: var(--gap);
            margin-bottom: var(--gap);
        }
        .tile {
            display: block;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--pad);
            transition: border-color .15s ease;
        }
        .tile:hover { border-color: var(--faint); }
        .tile-label { font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
        .tile-value {
            margin-top: .3rem;
            font-size: 1.4rem;
            font-weight: 650;
            letter-spacing: -.015em;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tile-sub {
            margin-top: .25rem;
            font-size: .85rem;
            color: var(--muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tile-value.wrap {
            white-space: normal;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .tone-bad { color: var(--bad); }
        .tone-warn { color: var(--warn); }
        .tone-ok { color: var(--ok); }

        /* board of cards */
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
            grid-auto-flow: dense;
            gap: var(--gap);
            align-items: start;
        }
        .card {
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            scroll-margin-top: 1rem;
        }
        .card:has(.span-all) { grid-column: 1 / -1; }
        /* set by the script: thin rows the cards span, see layoutBoard. The cards keep their order. */
        .board.masonry { grid-auto-rows: 4px; grid-auto-flow: row; row-gap: 0; }
        .board.masonry > .card { margin-bottom: var(--gap); }
        tr.capped { display: none; }
        .show-all { padding: 0; border: 0; background: none; font: inherit; color: var(--accent); cursor: pointer; }
        .show-all:hover { text-decoration: underline; }
        .card:target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
        .card-head, .card > h2 {
            display: flex;
            align-items: baseline;
            gap: .5rem;
            margin: 0;
            padding: var(--pad) var(--pad) .5rem;
        }
        .card h2 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: -.01em; }
        .card h2 span { color: var(--muted); font-weight: 450; }
        .count { font-size: .8rem; color: var(--muted); }
        .meta { margin-left: auto; color: var(--muted); font-size: .8rem; white-space: nowrap; }
        .empty { margin: 0; padding: .25rem var(--pad) var(--pad); color: var(--muted); font-size: .9rem; }
        .card-foot { display: flex; align-items: center; gap: 1rem; padding: .6rem var(--pad); border-top: 1px solid var(--border); font-size: .8rem; color: var(--muted); }
        .card-foot a:hover, .sub a:hover { color: var(--accent); }
        .scroll { overflow-x: auto; }

        /* lists, built from tables so they also survive email clients */
        table { width: 100%; border-collapse: collapse; }
        .list td, .list th { padding: .55rem .5rem; text-align: left; vertical-align: top; }
        .list td:first-child, .list th:first-child { padding-left: var(--pad); }
        .list td:last-child, .list th:last-child { padding-right: var(--pad); }
        .list tr + tr > td { border-top: 1px solid var(--border); }
        .list tr.group > th {
            padding-top: .9rem;
            padding-bottom: .2rem;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--faint);
        }
        .list tr.group + tr > td { border-top: none; }
        .list tbody tr:last-child > td { padding-bottom: var(--pad); }
        /* custom templates that bring their own tables */
        .card > table:not(.list) td, .card > table:not(.list) th { padding: .5rem var(--pad); text-align: left; }

        .title { font-weight: 550; overflow-wrap: anywhere; }
        .sub { color: var(--muted); font-size: .85rem; }
        .end { text-align: right; white-space: nowrap; }
        .when { width: 1%; white-space: nowrap; }
        .nowrap { white-space: nowrap; }
        .lead { width: 1%; padding-right: 0 !important; }
        .tag { color: var(--faint); }
        .nil { color: var(--faint); }
        .mono { font-family: var(--mono); font-size: .8rem; }
        .logs td:last-child { overflow-wrap: anywhere; }
        .agenda .when { min-width: 7.5rem; }
        .agenda tr.past > td { opacity: .45; }
        .now-badge {
            display: block;
            width: fit-content;
            margin-top: .2rem;
            padding: 0 .45rem;
            border-radius: 99px;
            background: color-mix(in srgb, var(--accent) 14%, transparent);
            color: var(--accent);
            font-size: .7rem;
            font-weight: 650;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .list tr.highlight .day { color: var(--accent); font-weight: 650; }
        .card-note { margin: 0 var(--pad) .5rem; padding: .45rem .7rem; border-radius: 10px; font-size: .85rem; color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
        /* calendars are told apart by a colored dot in front of their name */
        .cal { white-space: nowrap; }
        .cal::before { content: ""; display: inline-block; width: .45rem; height: .45rem; margin-right: .3rem; border-radius: 50%; background: var(--cal); transform: translateY(-.05rem); }
        .cal-0 { --cal: #3b82f6; }
        .cal-1 { --cal: #a855f7; }
        .cal-2 { --cal: #10b981; }
        .cal-3 { --cal: #ec4899; }
        .cal-4 { --cal: #f59e0b; }
        .due-overdue { color: var(--bad); font-weight: 600; }
        .due-today { color: var(--warn); font-weight: 600; }
        .dot.due-overdue { background: var(--bad); }
        .dot.due-today { background: var(--warn); }
        .list tr.group.overdue > th { color: var(--bad); }
        .list tr.group.today > th { color: var(--warn); }

        .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--border); transform: translateY(-.05rem); }
        .dot.red, .dot.critical { background: var(--bad); }
        .dot.orange, .dot.warning { background: var(--warn); }
        .dot.yellow { background: var(--yellow); }
        .dot.info { background: var(--accent); }

        /* attention classes produced by the datasources */
        .red { color: var(--bad); font-weight: 600; }
        .orange { color: var(--warn); font-weight: 600; }
        .yellow { color: var(--yellow); font-weight: 600; }
        .blue, .lightblue { color: var(--cold); font-weight: 600; }

        /* weather */
        .forecast { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); column-gap: calc(var(--gap) * 2); padding: 0 var(--pad) .5rem; }
        .hours { table-layout: fixed; margin: .25rem 0 .75rem; }
        .hours td { padding: .2rem 0; text-align: center; white-space: nowrap; }
        .hours .h-time { font-size: .75rem; color: var(--muted); }
        .hours .h-icon { font-size: 1.35rem; line-height: 1.5; }
        .hours .h-temp { font-weight: 650; font-size: 1.05rem; }
        .hours .h-pop { font-size: .72rem; color: var(--cold); height: 1.2em; }
        .pop { position: relative; display: inline-block; width: .4rem; height: 1.6rem; border-radius: 99px; background: var(--surface-2); overflow: hidden; vertical-align: bottom; }
        .pop span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cold); border-radius: 99px; }
        .days td { padding: .45rem .35rem; white-space: nowrap; }
        .days td:first-child { padding-left: 0; }
        .days td:last-child { padding-right: 0; }
        .days tr + tr td { border-top: 1px solid var(--border); }
        .days .d-label { font-weight: 550; width: 5.5rem; }
        .days .d-icon { width: 2rem; font-size: 1.15rem; text-align: center; }
        .days .d-min { color: var(--muted); text-align: right; width: 2.5rem; }
        .days .d-max { font-weight: 650; width: 2.5rem; }
        .days .d-rain { color: var(--cold); font-size: .8rem; text-align: right; width: 4rem; }
        .range { position: relative; height: .35rem; border-radius: 99px; background: var(--surface-2); min-width: 4rem; }
        .range span { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--cold), var(--warm)); }

        details.more { border-top: 1px solid var(--border); }
        details.more > summary { display: flex; padding: .6rem var(--pad); font-size: .8rem; color: var(--muted); cursor: pointer; list-style: none; }
        details.more > summary::-webkit-details-marker { display: none; }
        details.more > summary::after { content: "↓"; margin-left: .35rem; }
        details.more[open] > summary::after { content: "↑"; }
        details.more > summary:hover { color: var(--text); }
        .details td, .details th { padding: .4rem .6rem; text-align: right; white-space: nowrap; font-size: .85rem; }
        .details td:first-child, .details th:first-child { padding-left: var(--pad); text-align: left; }
        .details td:nth-child(2), .details th:nth-child(2) { text-align: left; }
        .details td:last-child, .details th:last-child { padding-right: var(--pad); }
        .details thead th { font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
        .details tbody td { border-top: 1px solid var(--border); }
        .details tr.group th { text-align: left; padding-top: .8rem; font-size: .75rem; color: var(--muted); }

        /* summary sentences, only used when there are no tiles */
        .glance { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); margin-bottom: var(--gap); }
        .glance-item { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--pad); }
        .glance-label { font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
        .glance-item ul { margin: .3rem 0 0; padding: 0; list-style: none; font-size: .9rem; }

        /* pages next to the dashboard */
        .back { color: var(--muted); font-size: .9rem; font-weight: 550; }
        .back:hover { color: var(--text); }
        .head-link { color: var(--accent); font-size: .8rem; white-space: nowrap; }
        .head-link:hover { text-decoration: underline; }

        /* month view of the calendar */
        .month-head { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem; margin-bottom: var(--gap); }
        .month-head h1 { margin: 0; font-size: 1.5rem; font-weight: 650; letter-spacing: -.02em; }
        .legend { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-size: .85rem; color: var(--muted); }
        .month-nav { margin-left: auto; display: flex; gap: .4rem; }
        .btn {
            display: inline-grid;
            place-items: center;
            min-width: 2.25rem;
            height: 2.25rem;
            padding: 0 .75rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: .9rem;
            font-weight: 550;
        }
        .btn:hover { border-color: var(--faint); }
        .btn.is-current { color: var(--muted); }

        .month {
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: var(--gap);
        }
        .month th { padding: .6rem .5rem; font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); text-align: left; border-bottom: 1px solid var(--border); }
        .month td { height: 7.5rem; padding: .35rem; vertical-align: top; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        .month td:last-child { border-right: none; }
        .month tr:last-child td { border-bottom: none; }
        .month td.weekend { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
        .month td.outside { background: var(--bg); }
        .month td.outside > * { opacity: .45; }
        .day-num { display: inline-grid; place-items: center; min-width: 1.75rem; height: 1.75rem; padding: 0 .3rem; border-radius: 99px; font-size: .85rem; font-weight: 600; }
        a.day-num:hover { background: var(--surface-2); }
        .month td.past .day-num { color: var(--muted); }
        .month td.today .day-num { background: var(--accent); color: #fff; }
        .day-entries { list-style: none; margin: .2rem 0 0; padding: 0; display: grid; gap: .2rem; }
        .entry {
            font-size: .78rem;
            line-height: 1.4;
            padding: .05rem .4rem;
            border-left: 3px solid var(--cal, var(--accent));
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .entry.spans { background: color-mix(in srgb, var(--cal, var(--accent)) 16%, transparent); font-weight: 550; }
        .entry-time { color: var(--muted); }
        .month td.past .entry { opacity: .55; }
        .entry-more a { padding-left: .45rem; font-size: .75rem; color: var(--muted); }
        .entry-more a:hover { color: var(--text); }
        .day-dots { display: none; }
        .month-list .group { scroll-margin-top: 1rem; }
        .month-list .group:target > th { color: var(--accent); }
        .month-empty { padding: 0; }

        @media (max-width: 640px) {
            .top h1 span { display: block; font-size: 1rem; }
            .status .updated-label { display: none; }

            .month-head h1 { font-size: 1.25rem; }
            .month th { padding: .5rem 0; text-align: center; }
            .month td { height: 3.25rem; padding: .2rem 0; text-align: center; }
            .day-num { font-size: .8rem; min-width: 1.6rem; height: 1.6rem; }
            .day-entries { display: none; }
            .day-dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; max-height: 12px; overflow: hidden; margin-top: .1rem; }
            .day-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--cal, var(--accent)); }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; animation: none !important; }
        }
    </style>
{{ end }}
