<nav class="glance" aria-label="At a glance">
    {{ range . }}
    {{ if .Data }}
    <a class="glance-item" href="#{{ nameToId .Name }}">
        <span class="glance-label">{{ .Name }}</span>
        <ul>
            {{ range .Data }}<li>{{ . }}</li>{{ end }}
        </ul>
    </a>
    {{ end }}
    {{ end }}
</nav>
